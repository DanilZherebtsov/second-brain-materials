<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Логотип кофейни «Ладья» -->
  <!-- Силуэт шахматной фигуры «ладья» (тур-башня) в фирменных цветах -->

  <!-- Фон-плашка -->
  <rect x="0" y="0" width="200" height="200" fill="#FAF4E8"/>

  <!-- Основание -->
  <rect x="40" y="160" width="120" height="14" rx="2" fill="#3D2817"/>
  <rect x="50" y="146" width="100" height="14" fill="#3D2817"/>

  <!-- Тело башни -->
  <rect x="58" y="70" width="84" height="76" fill="#3D2817"/>

  <!-- Перешеек к зубцам -->
  <rect x="52" y="58" width="96" height="12" fill="#3D2817"/>

  <!-- Зубцы (battlements) -->
  <rect x="52" y="40" width="16" height="18" fill="#3D2817"/>
  <rect x="76" y="40" width="16" height="18" fill="#3D2817"/>
  <rect x="100" y="40" width="16" height="18" fill="#3D2817"/>
  <rect x="124" y="40" width="16" height="18" fill="#3D2817"/>

  <!-- Окно-арка на теле башни -->
  <path d="M 88 110 Q 88 96 100 96 Q 112 96 112 110 L 112 130 L 88 130 Z" fill="#E8D5B7"/>

  <!-- Подпись «ЛАДЬЯ» — опционально, простой шрифт -->
  <!-- (текст положим в HTML рядом, не в самом SVG, чтобы фигура была чистой) -->
</svg>
