<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="Эпиграф">
  <title>Эпиграф</title>
  <desc>Знак «Эпиграф»: тонкая бронзовая арка — силуэт окна доходного дома с замковым камнем и подоконником; внутри — открывающая кавычка «, нарисованная контурами. Под знаком — вордмарк ЭПИГРАФ в разрядку.</desc>

  <!-- Фон прозрачный: знак ставится на «бумагу» #F7F4EE или «камень» #ECE6DC -->

  <!-- ЗНАК -->
  <g fill="none" stroke="#A27B4E" stroke-width="3" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- Арка: полуциркульное окно доходного дома -->
    <path d="M 165 194 V 104 A 35 35 0 0 1 235 104 V 194"/>
  </g>
  <g fill="#A27B4E" stroke="none">
    <!-- Замковый камень -->
    <path d="M 194.5 62.5 L 205.5 62.5 L 203.5 76.5 L 196.5 76.5 Z"/>
    <!-- Подоконник: основная тяга и тонкая нижняя -->
    <rect x="155" y="192.5" width="90" height="3"/>
    <rect x="159" y="198.85" width="82" height="1.1"/>
    <!-- Открывающая кавычка «: два уголка, контурами (не шрифтом) -->
    <path d="M 182.85 138 L 195.85 122 L 201.65 122 L 188.65 138 L 201.65 154 L 195.85 154 Z"/>
    <path d="M 198.35 138 L 211.35 122 L 217.15 122 L 204.15 138 L 217.15 154 L 211.35 154 Z"/>
  </g>

  <!-- ВОРДМАРК: в разрядку; x сдвинут на половину разрядки, чтобы компенсировать хвост letter-spacing -->
  <text x="205.25" y="251" text-anchor="middle" fill="#22201D"
        font-family="'Cormorant Garamond', Georgia, serif" font-weight="500"
        font-size="36" letter-spacing="10.5">ЭПИГРАФ</text>
</svg>
